name: CD

# Explained in docs/learning/cd.yml.md.
# Never runs Terraform (infra is applied from the laptop) and never uses `environment:`
# (it would change the OIDC sub claim the deploy role's trust policy pins).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      inject_live_check_failure:
        description: "Fault injection: force the post-traffic live check to fail (proves auto-rollback)"
        type: boolean
        default: false

permissions:
  id-token: write # mint the GitHub OIDC token that AWS STS exchanges for role credentials
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false # never kill a deploy between "alias moved" and "live check"

env:
  AWS_REGION: ap-southeast-1
  FUNCTION_NAME: guarded-deploy
  ECR_REPOSITORY: guarded-deploy
  TRIVY_VERSION: "0.76.1"
  # sha256 of trivy_0.76.1_Linux-ARM64.tar.gz, from the GitHub release asset digest (same as ci.yml)
  TRIVY_SHA256: e174dff2a6dba5e3ae41f8d0537a6324405bd08132497340304c6b20e0f16a1f

jobs:
  deploy:
    # workflow_dispatch can target any branch; the trust policy would reject it anyway.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tool versions (runner image, not assumed)
        run: |
          aws --version
          docker version --format 'docker client {{.Client.Version}} server {{.Server.Version}}'
          jq --version
          curl --version | head -n 1

      - name: Assume deploy role via OIDC (no stored keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cd-${{ github.run_id }}-${{ github.run_attempt }}
          mask-aws-account-id: true # public repo: keep the account ID out of public logs

      - name: ECR login (aws CLI)
        id: ecr
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::${account}"
          registry="${account}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          echo "image_uri=${registry}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Does this SHA's image already exist? (tags are immutable)
        id: exists
        run: |
          if out="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$GITHUB_SHA" 2>&1)"; then
            echo "Image tag already in ECR: skipping build/scan/push"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q ImageNotFoundException <<<"$out"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$out" >&2 # e.g. AccessDenied: fail loudly, never guess
            exit 1
          fi

      - name: Install Trivy ${{ env.TRIVY_VERSION }}
        if: steps.exists.outputs.exists == 'false'
        run: |
          curl -fsSL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-ARM64.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz -C "$RUNNER_TEMP" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build prod image
        if: steps.exists.outputs.exists == 'false'
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.image_uri }}
        run: |
          docker build --target prod --platform linux/arm64 \
            --provenance=false --sbom=false \
            --build-arg GIT_SHA="$GITHUB_SHA" -t "$IMAGE_URI" .

      - name: Trivy image scan (gate before push)
        if: steps.exists.outputs.exists == 'false'
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.image_uri }}
        run: trivy image --severity HIGH,CRITICAL --exit-code 1 "$IMAGE_URI"

      - name: Push image
        if: steps.exists.outputs.exists == 'false'
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.image_uri }}
        run: docker push "$IMAGE_URI"

      - name: Deploy (smoke test -> move alias -> live check -> auto-rollback)
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.image_uri }}
          GIT_SHA: ${{ github.sha }}
          API_URL: ${{ vars.API_URL }}
          INJECT_LIVE_CHECK_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.inject_live_check_failure }}
        run: scripts/deploy.sh
